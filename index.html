            const sub = cat.subgroups.find(s => s.id === subId);
            if (sub) sub.items.push(newItem);
          } else {
            cat.items.push(newItem);
          }

          saveState(true, `已新增「${name}」`);
          render();
        });

        // 點擊按鈕操作委派
        catContainer.addEventListener('click', async (e) => {
          const actionEl = e.target.closest('[data-action]');
          if (!actionEl) return;
          const action = actionEl.dataset.action;
          const { catId, subId, itemId } = actionEl.dataset;
          const catIndex = state.categories.findIndex(c => c.id === catId);
          const cat = state.categories[catIndex];
          if (!cat) return;

          // 收合/展開大組
          if (action === 'toggle-collapse') {
            cat.collapsed = !cat.collapsed;
            saveState(false);
            render();
            return;
          }

          // 編輯大組名稱
          if (action === 'edit-category') {
            const res = await openModal({
              title: '編輯大組名稱',
              mode: 'input-simple',
              defaultName: cat.name,
              confirmText: '儲存'
            });
            if (res && res.name) {
              cat.name = res.name;
              saveState(true, '已更新大組名稱');
              render();
            }
            return;
          }

          // 刪除大組
          if (action === 'delete-category') {
            const totalCount = cat.items.length + cat.subgroups.reduce((acc, s) => acc + s.items.length, 0);
            const ok = await openModal({
              title: `刪除大組「${cat.name}」？`,
              message: totalCount > 0
                ? `此大組內共有 ${totalCount} 個細項，刪除後將一併移除且無法復原。`
                : '確定要刪除此空白大組嗎？',
              confirmText: '刪除大組',
              confirmClass: 'bg-rose-600 hover:bg-rose-500 text-white'
            });
            if (ok) {
              state.categories.splice(catIndex, 1);
              saveState(true, `已刪除「${cat.name}」`);
              render();
            }
            return;
          }

          // 大組上下移動
          if (action === 'move-cat-up' && catIndex > 0) {
            [state.categories[catIndex - 1], state.categories[catIndex]] = [state.categories[catIndex], state.categories[catIndex - 1]];
            saveState(true, '已調整大組順序');
            render();
            return;
          }
          if (action === 'move-cat-down' && catIndex < state.categories.length - 1) {
            [state.categories[catIndex + 1], state.categories[catIndex]] = [state.categories[catIndex], state.categories[catIndex + 1]];
            saveState(true, '已調整大組順序');
            render();
            return;
          }

          // 新建小組
          if (action === 'add-subgroup') {
            const res = await openModal({
              title: `在「${cat.name}」新增小組`,
              message: '輸入子分類名稱（例如：貼身衣物、充電線材、隨身藥品）：',
              mode: 'input-simple',
              defaultName: '',
              confirmText: '建立小組'
            });
            if (res && res.name) {
              cat.collapsed = false;
              cat.subgroups.push({
                id: uid('sub'),
                name: res.name,
                collapsed: false,
                items: []
              });
              saveState(true, `已建立小組「${res.name}」`);
              render();
            }
            return;
          }

          // 小組相關操作
          const subIndex = subId ? cat.subgroups.findIndex(s => s.id === subId) : -1;
          const sub = subIndex !== -1 ? cat.subgroups[subIndex] : null;

          if (action === 'toggle-sub-collapse' && sub) {
            sub.collapsed = !sub.collapsed;
            saveState(false);
            render();
            return;
          }

          if (action === 'edit-subgroup' && sub) {
            const res = await openModal({
              title: '編輯小組名稱',
              mode: 'input-simple',
              defaultName: sub.name,
              confirmText: '儲存'
            });
            if (res && res.name) {
              sub.name = res.name;
              saveState(true, '已更新小組名稱');
              render();
            }
            return;
          }

          if (action === 'delete-subgroup' && sub) {
            if (sub.items.length === 0) {
              const ok = await openModal({
                title: `刪除小組「${sub.name}」？`,
                message: '確定要刪除此空白小組嗎？',
                confirmText: '刪除小組',
                confirmClass: 'bg-rose-600 hover:bg-rose-500 text-white'
              });
              if (ok) {
                cat.subgroups.splice(subIndex, 1);
                saveState(true, `已刪除小組「${sub.name}」`);
                render();
              }
            } else {
              const choice = await openModal({
                title: `刪除小組「${sub.name}」`,
                message: `此小組內還有 ${sub.items.length} 個細項，請選擇處理方式：`,
                mode: 'delete-subgroup'
              });
              if (choice === 'move') {
                cat.items.push(...sub.items);
                cat.subgroups.splice(subIndex, 1);
                saveState(true, `已刪除小組，${sub.items.length} 個細項已移回大組直屬`);
                render();
              } else if (choice === 'purge') {
                cat.subgroups.splice(subIndex, 1);
                saveState(true, `已連同細項刪除小組「${sub.name}」`);
                render();
              }
            }
            return;
          }

          if (action === 'move-sub-up' && sub && subIndex > 0) {
            [cat.subgroups[subIndex - 1], cat.subgroups[subIndex]] = [cat.subgroups[subIndex], cat.subgroups[subIndex - 1]];
            saveState(true, '已調整小組順序');
            render();
            return;
          }
          if (action === 'move-sub-down' && sub && subIndex < cat.subgroups.length - 1) {
            [cat.subgroups[subIndex + 1], cat.subgroups[subIndex]] = [cat.subgroups[subIndex], cat.subgroups[subIndex + 1]];
            saveState(true, '已調整小組順序');
            render();
            return;
          }

          // 細項編輯與刪除
          const itemList = sub ? sub.items : cat.items;
          const itemIndex = itemId ? itemList.findIndex(i => i.id === itemId) : -1;
          const item = itemIndex !== -1 ? itemList[itemIndex] : null;

          if (action === 'edit-item' && item) {
            const locationOptions = [
              { value: 'direct', label: `大組直屬（${cat.name} · 未分小組）` },
              ...cat.subgroups.map(s => ({
                value: s.id,
                label: `小組：${s.name}`
              }))
            ];
            const res = await openModal({
              title: '編輯細項內容',
              mode: 'edit-item',
              defaultName: item.name,
              defaultQty: item.qty,
              defaultWeight: item.weight,
              defaultNote: item.note,
              locationOptions,
              defaultLocation: sub ? sub.id : 'direct',
              confirmText: '儲存變更'
            });
            if (res && res.name) {
              item.name = res.name;
              item.qty = res.qty;
              item.weight = res.weight;
              item.note = res.note;

              const currentLoc = sub ? sub.id : 'direct';
              if (res.location !== currentLoc) {
                itemList.splice(itemIndex, 1);
                if (res.location === 'direct') {
                  cat.items.push(item);
                } else {
                  const targetSub = cat.subgroups.find(s => s.id === res.location);
                  if (targetSub) targetSub.items.push(item);
                  else cat.items.push(item);
                }
              }
              saveState(true, '已更新細項');
              render();
            }
            return;
          }

          if (action === 'delete-item' && item) {
            itemList.splice(itemIndex, 1);
            saveState(true, `已刪除「${item.name}」`);
            render();
          }
        });
      }

      // 啟動應用
      window.addEventListener('DOMContentLoaded', () => {
        setupPwaAndIcons();
        loadState();
        bindEvents();
        render();
      });
    })();
  </script>
</body>
</html>
