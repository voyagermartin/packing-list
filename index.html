<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="行李檢查表" />
  <meta name="theme-color" content="#059669" />
  <title>行李檢查表 | Don Quijote OS</title>

  <!-- 動態生成的網頁圖示、iOS 桌面捷徑與 Web App Manifest -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="" />
  <link id="dynamic-apple-icon" rel="apple-touch-icon" sizes="180x180" href="" />
  <link id="dynamic-manifest" rel="manifest" href="" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    /* 頂部控制列維持標準 16px 基準，避免放大字體時頂部按鈕膨脹佔據手機畫面 */
    html {
      font-size: 16px;
    }
    body {
      font-family: "Inter", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 三級字體縮放變數：專注放大清單內容區（大組、小組、細項、輸入框與勾選框） */
    #checklist-content-area {
      --item-base: 19px;
      --group-title: 20px;
      --subgroup-title: 18px;
      --badge-text: 14px;
      --input-text: 16px;
      --checkbox-size: 24px;
    }
    #checklist-content-area[data-scale="sm"] {
      --item-base: 16px;
      --group-title: 17px;
      --subgroup-title: 15.5px;
      --badge-text: 12.5px;
      --input-text: 14.5px;
      --checkbox-size: 21px;
    }
    #checklist-content-area[data-scale="md"] {
      --item-base: 19px;
      --group-title: 20px;
      --subgroup-title: 18px;
      --badge-text: 14px;
      --input-text: 16px;
      --checkbox-size: 24px;
    }
    #checklist-content-area[data-scale="lg"] {
      --item-base: 22px;
      --group-title: 23px;
      --subgroup-title: 20.5px;
      --badge-text: 15.5px;
      --input-text: 18px;
      --checkbox-size: 27px;
    }

    .scale-group-title {
      font-size: var(--group-title);
      line-height: 1.35;
    }
    .scale-subgroup-title {
      font-size: var(--subgroup-title);
      line-height: 1.35;
    }
    .scale-item-text {
      font-size: var(--item-base);
      line-height: 1.45;
    }
    .scale-badge-text {
      font-size: var(--badge-text);
      line-height: 1.25;
    }
    .scale-input-text {
      font-size: var(--input-text);
      line-height: 1.4;
    }
    .scale-checkbox {
      width: var(--checkbox-size);
      height: var(--checkbox-size);
    }

    /* 觸控拖曳手把與 SortableJS 拖曳視覺回饋 */
    .drag-handle {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .sortable-ghost {
      opacity: 0.4;
      background-color: rgba(16, 185, 129, 0.12) !important;
      border-style: dashed !important;
      border-color: #10b981 !important;
    }
    .sortable-chosen {
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.18);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">

  <!-- 主容器 -->
  <div id="app" class="max-w-5xl mx-auto p-3 sm:p-5 md:p-6 pb-20">
    
    <!-- 頂部控制與進度儀表板：採用正常文件流（無 sticky），捲動時完全不遮擋下方清單 -->
    <header class="bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-3 sm:p-4 shadow-xs mb-3.5">
      
      <!-- 第一列：可愛行李箱 LOGO + 標題 + 精巧三級字體切換器（固定 px 尺寸） -->
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <!-- 可愛復古行李箱內嵌向量圖示 -->
          <div class="w-9 h-9 rounded-xl shadow-2xs shrink-0 overflow-hidden ring-1 ring-amber-400/40" aria-hidden="true">
            <svg viewBox="0 0 120 120" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#34D399"/>
                  <stop offset="100%" stop-color="#059669"/>
                </linearGradient>
                <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#FBBF24"/>
                  <stop offset="100%" stop-color="#D97706"/>
                </linearGradient>
              </defs>
              <rect width="120" height="120" rx="28" fill="url(#bgGrad)"/>
              <circle cx="24" cy="26" r="3" fill="#FEF3C7" opacity="0.85"/>
              <circle cx="96" cy="24" r="4" fill="#FEF3C7" opacity="0.9"/>
              <path d="M98 40 L100 44 L104 46 L100 48 L98 52 L96 48 L92 46 L96 44 Z" fill="#FFFFFF" opacity="0.85"/>
              <path d="M44 38 V28 C44 24.5 46.8 22 50.2 22 H69.8 C73.2 22 76 24.5 76 28 V38" fill="none" stroke="#78350F" stroke-width="6.5" stroke-linecap="round"/>
              <path d="M44 38 V28 C44 24.5 46.8 22 50.2 22 H69.8 C73.2 22 76 24.5 76 28 V38" fill="none" stroke="#FEF3C7" stroke-width="2.5" stroke-linecap="round"/>
              <rect x="33" y="94" width="10" height="9" rx="4.5" fill="#451A03"/>
              <rect x="77" y="94" width="10" height="9" rx="4.5" fill="#451A03"/>
              <rect x="22" y="36" width="76" height="60" rx="14" fill="url(#caseGrad)" stroke="#92400E" stroke-width="3"/>
              <rect x="26" y="40" width="68" height="10" rx="6" fill="#FDE68A" opacity="0.45"/>
              <rect x="37" y="36" width="9" height="60" fill="#78350F"/>
              <rect x="74" y="36" width="9" height="60" fill="#78350F"/>
              <rect x="35.5" y="61" width="12" height="9" rx="2.5" fill="#FDE047" stroke="#92400E" stroke-width="1.8"/>
              <rect x="72.5" y="61" width="12" height="9" rx="2.5" fill="#FDE047" stroke="#92400E" stroke-width="1.8"/>
              <g transform="translate(53, 52) rotate(-10)">
                <rect x="0" y="0" width="16" height="12" rx="3" fill="#FFFBEB" stroke="#92400E" stroke-width="1.4"/>
                <path d="M8 9.5 C8 9.5 4 6.8 4 4.6 C4 3.4 4.9 2.6 6 2.6 C6.8 2.6 7.5 3.1 8 3.8 C8.5 3.1 9.2 2.6 10 2.6 C11.1 2.6 12 3.4 12 4.6 C12 6.8 8 9.5 8 9.5 Z" fill="#F43F5E"/>
              </g>
              <g transform="translate(52, 73) rotate(8)">
                <circle cx="8" cy="8" r="7" fill="#38BDF8" stroke="#0369A1" stroke-width="1.4"/>
                <path d="M4.5 9.5 L11.5 6.5 L9 11 L7.5 9 Z" fill="#FFFFFF"/>
              </g>
            </svg>
          </div>

          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h1 id="list-title" class="text-[17px] font-bold tracking-tight text-slate-900 dark:text-white cursor-pointer hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors truncate" title="點擊修改清單名稱">行李檢查表</h1>
              <span class="hidden sm:inline-block text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200/60 dark:border-slate-700/60 shrink-0">Don Quijote OS</span>
            </div>
            <p class="text-[12px] text-slate-500 dark:text-slate-400 truncate" id="status-subtitle">自動儲存 · 離線可用</p>
          </div>
        </div>

        <!-- 三級字體大小切換按鈕（鎖定精巧 px 尺寸，不隨字級放大而撐高頂部列） -->
        <div class="flex items-center gap-0.5 bg-slate-100 dark:bg-slate-800 p-0.5 rounded-xl border border-slate-200/80 dark:border-slate-700/80 shrink-0" role="group" aria-label="清單字體大小調整">
          <button
            type="button"
            data-font-size="sm"
            title="標準字體 (16px)"
            class="font-size-btn px-2.5 py-1 rounded-lg text-[13px] font-bold transition-all cursor-pointer"
          >
            A-
          </button>
          <button
            type="button"
            data-font-size="md"
            title="偏大字體 (19px)"
            class="font-size-btn px-2.5 py-1 rounded-lg text-[13px] font-bold transition-all cursor-pointer"
          >
            A
          </button>
          <button
            type="button"
            data-font-size="lg"
            title="特大字體 (22px)"
            class="font-size-btn px-2.5 py-1 rounded-lg text-[13px] font-bold transition-all cursor-pointer"
          >
            A+
          </button>
        </div>
      </div>

      <!-- 第二列：精巧操作功能列（固定 13px 字體與緊湊內距，手機單列不換行） -->
      <div class="flex flex-wrap items-center justify-between gap-1.5 mb-2.5">
        <!-- 篩選切換 -->
        <div class="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-0.5 border border-slate-200/60 dark:border-slate-700/60">
          <button type="button" id="filter-all-btn" class="px-2.5 py-1 text-[13px] font-medium rounded-lg transition-all cursor-pointer">
            全部
          </button>
          <button type="button" id="filter-unchecked-btn" class="px-2.5 py-1 text-[13px] font-medium rounded-lg transition-all cursor-pointer">
            只看未完成
          </button>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- 管理架構（排序模式） -->
          <button type="button" id="toggle-edit-mode-btn" class="inline-flex items-center gap-1 px-2.5 py-1.5 text-[13px] font-medium rounded-xl border transition-all cursor-pointer">
            <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
            <span id="edit-mode-label">管理架構</span>
          </button>

          <!-- 清空打勾（保留架構） -->
          <button type="button" id="reset-checks-btn" class="inline-flex items-center gap-1 px-2.5 py-1.5 text-[13px] font-medium rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-300 border border-amber-200/80 dark:border-amber-800/60 hover:bg-amber-100 dark:hover:bg-amber-900/60 transition-all cursor-pointer">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span>清空打勾</span>
          </button>

          <!-- 更多操作（匯出/匯入/範本） -->
          <div class="relative" id="more-menu-container">
            <button type="button" id="more-menu-btn" aria-label="更多選項" class="p-1.5 text-[13px] font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all cursor-pointer">
              <i data-lucide="more-vertical" class="w-4 h-4"></i>
            </button>
            <div id="more-menu-dropdown" class="hidden absolute right-0 mt-1.5 w-48 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl py-1 z-30 text-[14px]">
              <button type="button" id="export-json-btn" class="w-full text-left px-3.5 py-2 hover:bg-slate-100 dark:hover:bg-slate-700/70 flex items-center gap-2 text-slate-700 dark:text-slate-200 cursor-pointer">
                <i data-lucide="download" class="w-4 h-4 text-slate-400"></i>
                <span>匯出備份 (JSON)</span>
              </button>
              <button type="button" id="import-json-btn" class="w-full text-left px-3.5 py-2 hover:bg-slate-100 dark:hover:bg-slate-700/70 flex items-center gap-2 text-slate-700 dark:text-slate-200 cursor-pointer">
                <i data-lucide="upload" class="w-4 h-4 text-slate-400"></i>
                <span>匯入備份 (JSON)</span>
              </button>
              <div class="my-1 border-t border-slate-100 dark:border-slate-700"></div>
              <button type="button" id="load-template-btn" class="w-full text-left px-3.5 py-2 hover:bg-slate-100 dark:hover:bg-slate-700/70 flex items-center gap-2 text-slate-700 dark:text-slate-200 cursor-pointer">
                <i data-lucide="sparkles" class="w-4 h-4 text-emerald-500"></i>
                <span>載入預設旅行範本</span>
              </button>
            </div>
          </div>
          <input type="file" id="import-file-input" accept=".json,application/json" class="hidden" />
        </div>
      </div>

      <!-- 第三列：總進度條與重量統計（精巧單列呈現） -->
      <div>
        <div class="flex items-center justify-between gap-2 text-[12px] mb-1">
          <div class="flex items-center gap-2 min-w-0">
            <span class="font-semibold text-slate-700 dark:text-slate-200 shrink-0">
              進度：<span id="progress-count" class="text-emerald-600 dark:text-emerald-400 font-bold">0 / 0</span>
            </span>
            <span id="total-weight-badge" class="inline-flex items-center gap-1 text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md truncate">
              重量：<strong id="checked-weight-value" class="font-semibold text-emerald-600 dark:text-emerald-400">0 kg</strong>
              <span>/</span>
              <strong id="total-weight-value" class="font-semibold text-slate-700 dark:text-slate-300">0 kg</strong>
            </span>
          </div>
          <span id="progress-percent" class="font-bold text-emerald-600 dark:text-emerald-400 shrink-0">0%</span>
        </div>
        <div class="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
          <div id="progress-bar-fill" class="h-full bg-emerald-500 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- 清單內容區（三級字體縮放主要作用範圍，閱讀與點擊放大清晰） -->
    <div id="checklist-content-area" data-scale="md">
      <!-- 新增「大組（分類）」快速列 -->
      <form id="add-category-form" class="mb-4 flex gap-2">
        <input
          type="text"
          id="new-category-input"
          placeholder="新增大組（如：衣物穿搭、常備藥品...）"
          class="scale-input-text flex-1 min-w-0 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2.5 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition-all shadow-2xs"
          required
        />
        <button
          type="submit"
          class="scale-input-text inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-emerald-600 hover:bg-slate-800 dark:hover:bg-emerald-500 text-white font-semibold transition-all shadow-2xs shrink-0 cursor-pointer"
        >
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>新增大組</span>
        </button>
      </form>

      <!-- 大組清單網格 -->
      <main id="categories-container" class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
        <!-- 由 JavaScript 動態渲染大組、小組與細項 -->
      </main>

      <!-- 空狀態提示 -->
      <div id="empty-state" class="hidden text-center py-12 px-4 bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl">
        <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-3">
          <i data-lucide="backpack" class="w-6 h-6"></i>
        </div>
        <h3 class="scale-group-title font-semibold text-slate-800 dark:text-slate-200" id="empty-state-title">目前沒有任何行李分類</h3>
        <p class="scale-badge-text text-slate-500 dark:text-slate-400 mt-1 mb-4" id="empty-state-desc">在上方輸入大組名稱開始建立，或直接載入預設旅行範本。</p>
        <button type="button" id="empty-load-template-btn" class="scale-input-text inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium transition-all cursor-pointer">
          載入預設旅行範本
        </button>
      </div>
    </div>
  </div>

  <!-- 自訂對話框 Modal（取代原生 alert / confirm / prompt，支援三層編輯與移動選項） -->
  <div id="custom-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-xl transform transition-all max-h-[90vh] overflow-y-auto">
      <h3 id="modal-title" class="text-[18px] font-bold text-slate-900 dark:text-white mb-1.5">確認操作</h3>
      <p id="modal-message" class="text-[15px] text-slate-600 dark:text-slate-300 mb-4 leading-relaxed"></p>
      
      <!-- 編輯表單區塊 -->
      <div id="modal-inputs" class="hidden space-y-3.5 mb-5">
        <div>
          <label for="modal-input-name" class="block text-[13px] font-medium text-slate-600 dark:text-slate-400 mb-1">名稱</label>
          <input type="text" id="modal-input-name" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500" />
        </div>
        <div id="modal-extra-fields" class="space-y-3.5">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="modal-input-qty" class="block text-[13px] font-medium text-slate-600 dark:text-slate-400 mb-1">數量</label>
              <input type="number" id="modal-input-qty" min="1" placeholder="1" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500" />
            </div>
            <div>
              <label for="modal-input-weight" class="block text-[13px] font-medium text-slate-600 dark:text-slate-400 mb-1">單件克數 (g)</label>
              <input type="number" id="modal-input-weight" min="0" placeholder="例如: 250" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500" />
            </div>
          </div>
          <div>
            <label for="modal-input-note" class="block text-[13px] font-medium text-slate-600 dark:text-slate-400 mb-1">備註（選填）</label>
            <input type="text" id="modal-input-note" placeholder="例如：隨身登機、防水袋收納..." class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500" />
          </div>
          <div id="modal-location-wrap">
            <label for="modal-input-location" class="block text-[13px] font-medium text-slate-600 dark:text-slate-400 mb-1">所屬位置（可歸類進小組或移回大組直屬）</label>
            <select id="modal-input-location" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500">
              <!-- 動態填入大組直屬與各小組選項 -->
            </select>
          </div>
        </div>
      </div>

      <!-- 刪除小組時的雙選項按鈕 -->
      <div id="modal-subgroup-delete-actions" class="hidden flex-col gap-2">
        <button type="button" id="modal-sub-move-btn" class="w-full px-4 py-2.5 rounded-xl text-[14px] font-semibold bg-amber-600 hover:bg-amber-500 text-white transition-colors shadow-2xs cursor-pointer">
          僅刪小組（細項移回大組直屬）
        </button>
        <button type="button" id="modal-sub-purge-btn" class="w-full px-4 py-2.5 rounded-xl text-[14px] font-semibold bg-rose-600 hover:bg-rose-500 text-white transition-colors shadow-2xs cursor-pointer">
          連同細項一併刪除
        </button>
        <button type="button" id="modal-sub-cancel-btn" class="w-full px-4 py-2.5 rounded-xl text-[14px] font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
          取消
        </button>
      </div>

      <!-- 一般確認/取消按鈕 -->
      <div id="modal-standard-actions" class="flex justify-end gap-2">
        <button type="button" id="modal-cancel-btn" class="px-4 py-2.5 rounded-xl text-[14px] font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
          取消
        </button>
        <button type="button" id="modal-confirm-btn" class="px-4 py-2.5 rounded-xl text-[14px] font-semibold bg-emerald-600 hover:bg-emerald-500 text-white transition-colors shadow-2xs cursor-pointer">
          確定
        </button>
      </div>
    </div>
  </div>

  <!-- 輕量提示 Toast -->
  <div id="toast" class="fixed bottom-5 right-4 left-4 sm:left-auto z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-200 bg-slate-900 dark:bg-slate-800 text-white text-[14px] font-medium px-4 py-3 rounded-2xl shadow-lg border border-slate-700/60 flex items-center justify-center sm:justify-start gap-2">
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
    <span id="toast-message">已儲存變更</span>
  </div>

  <script>
    /**
     * Don Quijote OS - 三層彈性行李檢查表模組 (手機大字優化版)
     * 1. 頂部工具列採自然文件流且維持精巧固定比例，捲動時 100% 釋放手機閱讀空間
     * 2. 三級字體 (sm: 16px / md: 19px / lg: 22px) 專注放大清單內容區與勾選目標
     * 3. 完整支援 PWA 離線安裝 (Manifest + Service Worker) 與 postMessage 系統整合
     */
    (function () {
      const STORAGE_KEY_V2 = 'don_quijote_os_packing_checklist_v2';
      const STORAGE_KEY_V1 = 'don_quijote_os_packing_checklist_v1';
      const FONT_SIZE_KEY = 'don_quijote_os_packing_font_size';

      const FONT_SCALES = {
        sm: { label: '標準 (16px)' },
        md: { label: '偏大 (19px)' },
        lg: { label: '特大 (22px)' }
      };

      // 可愛行李箱高解析度向量圖字串
      const CUTE_SUITCASE_SVG = `
        <svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#34D399"/>
              <stop offset="100%" stop-color="#059669"/>
            </linearGradient>
            <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FBBF24"/>
              <stop offset="100%" stop-color="#D97706"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
          <circle cx="102" cy="110" r="13" fill="#FEF3C7" opacity="0.85"/>
          <circle cx="410" cy="102" r="16" fill="#FEF3C7" opacity="0.9"/>
          <path d="M418 170 L426 188 L444 196 L426 204 L418 222 L410 204 L392 196 L410 188 Z" fill="#FFFFFF" opacity="0.88"/>
          <path d="M188 162 V120 C188 104 200 94 214 94 H298 C312 94 324 104 324 120 V162" fill="none" stroke="#78350F" stroke-width="28" stroke-linecap="round"/>
          <path d="M188 162 V120 C188 104 200 94 214 94 H298 C312 94 324 104 324 120 V162" fill="none" stroke="#FEF3C7" stroke-width="10" stroke-linecap="round"/>
          <rect x="140" y="402" width="44" height="38" rx="18" fill="#451A03"/>
          <rect x="328" y="402" width="44" height="38" rx="18" fill="#451A03"/>
          <rect x="94" y="154" width="324" height="256" rx="58" fill="url(#caseGrad)" stroke="#92400E" stroke-width="12"/>
          <rect x="112" y="172" width="288" height="42" rx="24" fill="#FDE68A" opacity="0.45"/>
          <rect x="158" y="154" width="38" height="256" fill="#78350F"/>
          <rect x="316" y="154" width="38" height="256" fill="#78350F"/>
          <rect x="152" y="260" width="50" height="38" rx="10" fill="#FDE047" stroke="#92400E" stroke-width="7"/>
          <rect x="310" y="260" width="50" height="38" rx="10" fill="#FDE047" stroke="#92400E" stroke-width="7"/>
          <g transform="translate(226, 220) rotate(-10)">
            <rect x="0" y="0" width="68" height="52" rx="12" fill="#FFFBEB" stroke="#92400E" stroke-width="6"/>
            <path d="M34 40 C34 40 17 29 17 19.5 C17 14.5 21 11 25.5 11 C29 11 32 13 34 16 C36 13 39 11 42.5 11 C47 11 51 14.5 51 19.5 C51 29 34 40 34 40 Z" fill="#F43F5E"/>
          </g>
          <g transform="translate(222, 310) rotate(8)">
            <circle cx="34" cy="34" r="30" fill="#38BDF8" stroke="#0369A1" stroke-width="6"/>
            <path d="M19 40 L49 28 L38 47 L32 38 Z" fill="#FFFFFF"/>
          </g>
        </svg>
      `;

      // 設定 PWA 圖示、Manifest 與離線 Service Worker
      function setupPwaAndIcons() {
        try {
          const svgBlob = new Blob([CUTE_SUITCASE_SVG], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          const img = new Image();

          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.drawImage(img, 0, 0, 512, 512);
              const pngDataUrl = canvas.toDataURL('image/png');

              const faviconLink = document.getElementById('dynamic-favicon');
              const appleIconLink = document.getElementById('dynamic-apple-icon');
              if (faviconLink) faviconLink.href = pngDataUrl;
              if (appleIconLink) appleIconLink.href = pngDataUrl;

              const manifest = {
                name: '行李檢查表 | Don Quijote OS',
                short_name: '行李檢查表',
                start_url: './',
                scope: './',
                display: 'standalone',
                background_color: '#f8fafc',
                theme_color: '#059669',
                icons: [
                  {
                    src: pngDataUrl,
                    sizes: '512x512',
                    type: 'image/png',
                    purpose: 'any maskable'
                  }
                ]
              };
              const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
              const manifestLink = document.getElementById('dynamic-manifest');
              if (manifestLink) {
                manifestLink.href = URL.createObjectURL(manifestBlob);
              }
            }
            URL.revokeObjectURL(url);
          };
          img.src = url;
        } catch (err) {
          console.warn('PWA 圖示初始化略過:', err);
        }

        // 註冊內嵌輕量 Service Worker 支援離線開啟與 Android WebAPK 安裝
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
          try {
            const swCode = `
              const CACHE_NAME = 'dq-packing-pwa-v3';
              self.addEventListener('install', (e) => {
                self.skipWaiting();
              });
              self.addEventListener('activate', (e) => {
                e.waitUntil(self.clients.claim());
              });
              self.addEventListener('fetch', (e) => {
                if (e.request.method !== 'GET') return;
                e.respondWith(
                  fetch(e.request)
                    .then((res) => {
                      const copy = res.clone();
                      caches.open(CACHE_NAME).then((cache) => cache.put(e.request, copy)).catch(() => {});
                      return res;
                    })
                    .catch(() => caches.match(e.request))
                );
              });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
          } catch (e) {}
        }
      }

      // 套用並儲存字體大小等級 ('sm' | 'md' | 'lg') 至清單內容區
      function applyFontSize(sizeKey, notify = false) {
        const key = FONT_SCALES[sizeKey] ? sizeKey : 'md';
        const contentArea = document.getElementById('checklist-content-area');
        if (contentArea) {
          contentArea.setAttribute('data-scale', key);
        }
        try {
          localStorage.setItem(FONT_SIZE_KEY, key);
        } catch (e) {}

        document.querySelectorAll('.font-size-btn').forEach(btn => {
          const isActive = btn.dataset.fontSize === key;
          btn.className = isActive
            ? 'font-size-btn px-2.5 py-1 rounded-lg text-[13px] font-bold transition-all cursor-pointer bg-emerald-600 text-white shadow-2xs'
            : 'font-size-btn px-2.5 py-1 rounded-lg text-[13px] font-bold transition-all cursor-pointer text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700';
        });

        if (notify) {
          showToast(`清單字級已切換為${FONT_SCALES[key].label}`);
        }
      }

      const DEFAULT_TEMPLATE = {
        title: '行李檢查表',
        categories: [
          {
            id: 'cat-docs',
            name: '重要證件與隨身財務',
            collapsed: false,
            items: [
              { id: 'item-d1', name: '護照（確認效期 6 個月以上）', checked: false, qty: 1, weight: 40, note: '隨身夾層' },
              { id: 'item-d2', name: '身分證 / 駕照 / 日文譯本', checked: false, qty: 1, weight: 20, note: '' },
              { id: 'item-d3', name: '外幣現金與海外回饋信用卡', checked: false, qty: 1, weight: 80, note: '分兩處收納' },
              { id: 'item-d4', name: '機票與住宿憑證（離線截圖）', checked: false, qty: 1, weight: 0, note: '' }
            ],
            subgroups: []
          },
          {
            id: 'cat-clothes',
            name: '衣物穿搭',
            collapsed: false,
            items: [],
            subgroups: [
              {
                id: 'sub-outer',
                name: '上衣與下著',
                collapsed: false,
                items: [
                  { id: 'item-c1', name: '透氣快乾上衣', checked: false, qty: 3, weight: 160, note: '' },
                  { id: 'item-c2', name: '休閒長褲 / 彈性褲', checked: false, qty: 2, weight: 350, note: '' },
                  { id: 'item-c3', name: '防風薄外套 / 保暖層', checked: false, qty: 1, weight: 320, note: '機上防寒' }
                ]
              },
              {
                id: 'sub-inner',
                name: '貼身衣物',
                collapsed: false,
                items: [
                  { id: 'item-c4', name: '免洗 / 換洗內衣褲', checked: false, qty: 4, weight: 50, note: '' },
                  { id: 'item-c5', name: '舒適健走襪', checked: false, qty: 4, weight: 65, note: '' },
                  { id: 'item-c6', name: '輕便睡衣褲', checked: false, qty: 1, weight: 220, note: '' }
                ]
              }
            ]
          },
          {
            id: 'cat-tech',
            name: '電子與充電設備',
            collapsed: false,
            items: [
              { id: 'item-t1', name: '智慧型手機', checked: false, qty: 1, weight: 210, note: '' },
              { id: 'item-t2', name: '行動電源（務必隨身登機）', checked: false, qty: 1, weight: 215, note: '不可託運' },
              { id: 'item-t3', name: '多孔充電器與充電線組', checked: false, qty: 1, weight: 180, note: '' },
              { id: 'item-t4', name: '萬國轉接頭 / SIM 卡針', checked: false, qty: 1, weight: 95, note: '' }
            ],
            subgroups: []
          }
        ]
      };

      let state = {
        title: '行李檢查表',
        categories: [],
        filter: 'all', // 'all' | 'unchecked'
        editMode: false
      };

      const uid = (prefix = 'id') => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

      function normalizeItem(item) {
        return {
          id: item.id || uid('item'),
          name: item.name || '未命名項目',
          checked: Boolean(item.checked),
          qty: Math.max(1, parseInt(item.qty, 10) || 1),
          weight: Math.max(0, parseInt(item.weight, 10) || 0),
          note: item.note ? String(item.note) : ''
        };
      }

      function normalizeCategories(rawCategories) {
        if (!Array.isArray(rawCategories)) return [];
        return rawCategories.map(cat => ({
          id: cat.id || uid('cat'),
          name: cat.name || '未命名大組',
          collapsed: Boolean(cat.collapsed),
          items: Array.isArray(cat.items) ? cat.items.map(normalizeItem) : [],
          subgroups: Array.isArray(cat.subgroups)
            ? cat.subgroups.map(sub => ({
                id: sub.id || uid('sub'),
                name: sub.name || '未命名小組',
                collapsed: Boolean(sub.collapsed),
                items: Array.isArray(sub.items) ? sub.items.map(normalizeItem) : []
              }))
            : []
        }));
      }

      function loadState() {
        let savedFont = 'md';
        try {
          const storedFont = localStorage.getItem(FONT_SIZE_KEY);
          if (storedFont && FONT_SCALES[storedFont]) {
            savedFont = storedFont;
          }
        } catch (e) {}
        applyFontSize(savedFont, false);

        try {
          const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
          if (rawV2) {
            const parsed = JSON.parse(rawV2);
            if (parsed && Array.isArray(parsed.categories)) {
              state.title = parsed.title || '行李檢查表';
              state.categories = normalizeCategories(parsed.categories);
              return;
            }
          }

          const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
          if (rawV1) {
            const parsedV1 = JSON.parse(rawV1);
            if (parsedV1 && Array.isArray(parsedV1.categories)) {
              state.title = parsedV1.title || '行李檢查表';
              state.categories = normalizeCategories(parsedV1.categories);
              saveState(false);
              return;
            }
          }
        } catch (err) {
          console.error('讀取儲存資料失敗:', err);
        }

        state.title = DEFAULT_TEMPLATE.title;
        state.categories = normalizeCategories(JSON.parse(JSON.stringify(DEFAULT_TEMPLATE.categories)));
        saveState(false);
      }

      function saveState(notifyToast = true, message = '已自動儲存') {
        try {
          const payload = {
            version: 2,
            title: state.title,
            categories: state.categories,
            updatedAt: new Date().toISOString()
          };
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(payload));

          if (window.parent && window.parent !== window) {
            const stats = calculateStats();
            window.parent.postMessage({
              source: 'don-quijote-os-packing',
              type: 'DON_QUIJOTE_OS_PACKING_UPDATE',
              checkedCount: stats.checked,
              totalCount: stats.total,
              checkedWeightGrams: stats.checkedWeight,
              totalWeightGrams: stats.totalWeight,
              stats
            }, '*');
          }

          if (notifyToast) {
            showToast(message);
          }
        } catch (err) {
          console.error('儲存資料失敗:', err);
          showToast('儲存失敗，請檢查瀏覽器空間');
        }
      }

      function calculateStats() {
        let total = 0;
        let checked = 0;
        let totalWeight = 0;
        let checkedWeight = 0;

        const tallyItem = (item) => {
          total += 1;
          const qty = Number(item.qty) || 1;
          const w = (Number(item.weight) || 0) * qty;
          totalWeight += w;
          if (item.checked) {
            checked += 1;
            checkedWeight += w;
          }
        };

        state.categories.forEach(cat => {
          cat.items.forEach(tallyItem);
          cat.subgroups.forEach(sub => {
            sub.items.forEach(tallyItem);
          });
        });

        const percent = total === 0 ? 0 : Math.round((checked / total) * 100);
        return { total, checked, percent, totalWeight, checkedWeight };
      }

      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = msg;
        toast.classList.remove('opacity-0', 'translate-y-2');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
        }, 2000);
      }

      function openModal({
        title,
        message = '',
        mode = 'confirm',
        defaultName = '',
        defaultQty = 1,
        defaultWeight = 0,
        defaultNote = '',
        locationOptions = [],
        defaultLocation = 'direct',
        confirmText = '確定',
        confirmClass = 'bg-emerald-600 hover:bg-emerald-500 text-white'
      }) {
        return new Promise((resolve) => {
          const modal = document.getElementById('custom-modal');
          const titleEl = document.getElementById('modal-title');
          const msgEl = document.getElementById('modal-message');
          const inputsWrap = document.getElementById('modal-inputs');
          const extraFields = document.getElementById('modal-extra-fields');
          const nameInput = document.getElementById('modal-input-name');
          const qtyInput = document.getElementById('modal-input-qty');
          const weightInput = document.getElementById('modal-input-weight');
          const noteInput = document.getElementById('modal-input-note');
          const locationSelect = document.getElementById('modal-input-location');

          const standardActions = document.getElementById('modal-standard-actions');
          const cancelBtn = document.getElementById('modal-cancel-btn');
          const confirmBtn = document.getElementById('modal-confirm-btn');

          const subDeleteActions = document.getElementById('modal-subgroup-delete-actions');
          const subCancelBtn = document.getElementById('modal-sub-cancel-btn');
          const subMoveBtn = document.getElementById('modal-sub-move-btn');
          const subPurgeBtn = document.getElementById('modal-sub-purge-btn');

          titleEl.textContent = title;
          msgEl.textContent = message;
          msgEl.classList.toggle('hidden', !message);

          const isInputMode = mode === 'input-simple' || mode === 'edit-item';
          inputsWrap.classList.toggle('hidden', !isInputMode);
          extraFields.classList.toggle('hidden', mode !== 'edit-item');

          standardActions.classList.toggle('hidden', mode === 'delete-subgroup');
          subDeleteActions.classList.toggle('hidden', mode !== 'delete-subgroup');
          if (mode === 'delete-subgroup') {
            subDeleteActions.classList.add('flex');
          } else {
            subDeleteActions.classList.remove('flex');
          }

          if (isInputMode) {
            nameInput.value = defaultName;
          }
          if (mode === 'edit-item') {
            qtyInput.value = defaultQty || 1;
            weightInput.value = defaultWeight > 0 ? defaultWeight : '';
            noteInput.value = defaultNote || '';
            locationSelect.innerHTML = locationOptions
              .map(opt => `<option value="${escapeHtml(opt.value)}" ${opt.value === defaultLocation ? 'selected' : ''}>${escapeHtml(opt.label)}</option>`)
              .join('');
          }

          confirmBtn.textContent = confirmText;
          confirmBtn.className = `px-4 py-2.5 rounded-xl text-[14px] font-semibold transition-colors shadow-2xs cursor-pointer ${confirmClass}`;

          modal.classList.remove('hidden');

          if (isInputMode) {
            setTimeout(() => {
              nameInput.focus();
              nameInput.select();
            }, 30);
          } else if (mode === 'delete-subgroup') {
            setTimeout(() => subMoveBtn.focus(), 30);
          } else {
            setTimeout(() => confirmBtn.focus(), 30);
          }

          const cleanup = () => {
            modal.classList.add('hidden');
            cancelBtn.removeEventListener('click', onCancel);
            confirmBtn.removeEventListener('click', onConfirm);
            subCancelBtn.removeEventListener('click', onCancel);
            subMoveBtn.removeEventListener('click', onSubMove);
            subPurgeBtn.removeEventListener('click', onSubPurge);
            modal.removeEventListener('click', onBackdrop);
            document.removeEventListener('keydown', onKeydown);
          };

          const onCancel = () => {
            cleanup();
            resolve(null);
          };

          const onSubMove = () => {
            cleanup();
            resolve('move');
          };

          const onSubPurge = () => {
            cleanup();
            resolve('purge');
          };

          const onConfirm = () => {
            if (isInputMode) {
              const trimmed = nameInput.value.trim();
              if (!trimmed) {
                nameInput.focus();
                return;
              }
              cleanup();
              if (mode === 'edit-item') {
                resolve({
                  name: trimmed,
                  qty: Math.max(1, parseInt(qtyInput.value, 10) || 1),
                  weight: Math.max(0, parseInt(weightInput.value, 10) || 0),
                  note: noteInput.value.trim(),
                  location: locationSelect.value
                });
              } else {
                resolve({ name: trimmed });
              }
            } else {
              cleanup();
              resolve(true);
            }
          };

          const onBackdrop = (e) => {
            if (e.target === modal) onCancel();
          };

          const onKeydown = (e) => {
            if (e.key === 'Escape') onCancel();
            if (e.key === 'Enter' && isInputMode) {
              e.preventDefault();
              onConfirm();
            }
          };

          cancelBtn.addEventListener('click', onCancel);
          confirmBtn.addEventListener('click', onConfirm);
          subCancelBtn.addEventListener('click', onCancel);
          subMoveBtn.addEventListener('click', onSubMove);
          subPurgeBtn.addEventListener('click', onSubPurge);
          modal.addEventListener('click', onBackdrop);
          document.addEventListener('keydown', onKeydown);
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 格式化克數顯示（未滿 1000g 顯示 g，達 1000g 或總計模式顯示 kg）
      function formatWeight(grams, forceKg = false) {
        const g = Number(grams) || 0;
        if (g <= 0) return forceKg ? '0 kg' : '';
        if (forceKg || g >= 1000) {
          const kg = (g / 1000).toFixed(2).replace(/\.?0+$/, '');
          return `${kg} kg`;
        }
        return `${g}g`;
      }

      // 渲染單一細項列（左側加入專屬拖曳手把，手機滑動不誤觸）
      function renderItemRow(catId, subId, item) {
        const subAttr = subId ? `data-sub-id="${subId}"` : '';
        const qtyBadge = item.qty > 1
          ? `<span class="scale-badge-text font-semibold px-1.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 shrink-0">×${item.qty}</span>`
          : '';
        const weightStr = formatWeight((Number(item.weight) || 0) * (Number(item.qty) || 1));
        const weightBadge = weightStr
          ? `<span class="scale-badge-text text-slate-400 dark:text-slate-500 shrink-0">${weightStr}</span>`
          : '';
        const noteTag = item.note
          ? `<span class="scale-badge-text text-amber-700/90 dark:text-amber-300/90 bg-amber-50 dark:bg-amber-950/60 px-1.5 py-0.5 rounded-md shrink-0">${escapeHtml(item.note)}</span>`
          : '';

        return `
          <li data-item-id="${item.id}" class="group flex items-start justify-between gap-1.5 py-2.5 px-1.5 rounded-xl bg-white/60 dark:bg-slate-900/40 hover:bg-slate-100/90 dark:hover:bg-slate-800/80 transition-colors border-b border-slate-100/80 dark:border-slate-800/60 last:border-none">
            <div class="flex items-start gap-2 flex-1 min-w-0">
              <!-- 細項專屬拖曳手把 -->
              <span
                class="drag-handle mt-1 p-1 rounded-lg text-slate-300 dark:text-slate-600 hover:text-slate-600 dark:hover:text-slate-300 cursor-grab active:cursor-grabbing shrink-0"
                title="按住上下拖曳調整細項順序"
                aria-label="拖曳調整細項順序"
              >
                <i data-lucide="grip-vertical" class="w-4 h-4"></i>
              </span>

              <label class="flex items-start gap-2.5 flex-1 min-w-0 cursor-pointer select-none pt-0.5">
                <input
                  type="checkbox"
                  data-action="toggle-item"
                  data-cat-id="${catId}"
                  ${subAttr}
                  data-item-id="${item.id}"
                  ${item.checked ? 'checked' : ''}
                  class="scale-checkbox mt-0.5 rounded-md border-slate-300 dark:border-slate-600 text-emerald-600 focus:ring-emerald-500/40 bg-white dark:bg-slate-800 cursor-pointer shrink-0 accent-emerald-600"
                />
                <div class="flex flex-wrap items-center gap-x-2 gap-y-1 flex-1 min-w-0">
                  <span class="scale-item-text break-words transition-all ${item.checked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100 font-medium'}">
                    ${escapeHtml(item.name)}
                  </span>
                  ${qtyBadge}
                  ${weightBadge}
                  ${noteTag}
                </div>
              </label>
            </div>

            <div class="flex items-center gap-1 shrink-0">
              <button
                type="button"
                data-action="edit-item"
                data-cat-id="${catId}"
                ${subAttr}
                data-item-id="${item.id}"
                title="編輯細項（名稱 / 數量 / 重量 / 移動位置）"
                class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 bg-slate-100/80 dark:bg-slate-800/80 hover:bg-emerald-50 dark:hover:bg-slate-700 transition-colors cursor-pointer"
              >
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button
                type="button"
                data-action="delete-item"
                data-cat-id="${catId}"
                ${subAttr}
                data-item-id="${item.id}"
                title="刪除細項"
                class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 bg-slate-100/80 dark:bg-slate-800/80 hover:bg-rose-50 dark:hover:bg-rose-950/60 transition-colors cursor-pointer"
              >
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </li>
        `;
      }

      // 渲染快速新增細項輸入列
      function renderQuickAddForm(catId, subId, placeholderText) {
        const subAttr = subId ? `data-sub-id="${subId}"` : '';
        return `
          <form data-action="add-item-form" data-cat-id="${catId}" ${subAttr} class="flex items-center gap-1.5 pt-2">
            <input
              type="text"
              name="itemName"
              placeholder="${placeholderText}"
              required
              class="scale-input-text flex-1 min-w-0 bg-slate-50 dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-800 rounded-xl px-3 py-2 placeholder:text-slate-400 focus:outline-none transition-all"
            />
            <input
              type="number"
              name="itemQty"
              min="1"
              placeholder="數量"
              title="數量（預設 1）"
              class="scale-input-text w-14 bg-slate-50 dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-800 rounded-xl px-1.5 py-2 text-center placeholder:text-slate-400 focus:outline-none transition-all"
            />
            <input
              type="number"
              name="itemWeight"
              min="0"
              placeholder="克g"
              title="單件重量 g（選填）"
              class="scale-input-text w-16 hidden sm:block bg-slate-50 dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-800 rounded-xl px-1.5 py-2 text-center placeholder:text-slate-400 focus:outline-none transition-all"
            />
            <button
              type="submit"
              title="新增細項"
              class="p-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white transition-colors shrink-0 cursor-pointer shadow-2xs"
            >
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </form>
        `;
      }

      function render() {
        const container = document.getElementById('categories-container');
        const emptyState = document.getElementById('empty-state');
        const titleEl = document.getElementById('list-title');
        const editBtn = document.getElementById('toggle-edit-mode-btn');
        const editLabel = document.getElementById('edit-mode-label');

        titleEl.textContent = state.title;

        if (state.editMode) {
          editBtn.className = 'inline-flex items-center gap-1 px-2.5 py-1.5 text-[13px] font-semibold rounded-xl border border-emerald-500 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 transition-all cursor-pointer';
          editLabel.textContent = '完成管理';
        } else {
          editBtn.className = 'inline-flex items-center gap-1 px-2.5 py-1.5 text-[13px] font-medium rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700/80 text-slate-700 dark:text-slate-200 transition-all cursor-pointer';
          editLabel.textContent = '管理架構';
        }

        const allBtn = document.getElementById('filter-all-btn');
        const uncheckedBtn = document.getElementById('filter-unchecked-btn');
        const activeTabClass = 'px-2.5 py-1 text-[13px] font-semibold rounded-lg transition-all bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-2xs cursor-pointer';
        const inactiveTabClass = 'px-2.5 py-1 text-[13px] font-medium rounded-lg transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white cursor-pointer';
        allBtn.className = state.filter === 'all' ? activeTabClass : inactiveTabClass;
        uncheckedBtn.className = state.filter === 'unchecked' ? activeTabClass : inactiveTabClass;

        const stats = calculateStats();
        document.getElementById('progress-count').textContent = `${stats.checked} / ${stats.total}`;
        document.getElementById('progress-percent').textContent = `${stats.percent}%`;
        document.getElementById('progress-bar-fill').style.width = `${stats.percent}%`;
        document.getElementById('checked-weight-value').textContent = formatWeight(stats.checkedWeight, true);
        document.getElementById('total-weight-value').textContent = formatWeight(stats.totalWeight, true);

        const subtitle = document.getElementById('status-subtitle');
        if (stats.total > 0 && stats.checked === stats.total) {
          subtitle.textContent = '所有行李項目皆已確認完畢！';
          subtitle.className = 'text-[12px] text-emerald-600 dark:text-emerald-400 font-semibold truncate';
        } else {
          subtitle.textContent = state.editMode
            ? '管理模式：可調整大組與小組順序'
            : '自動儲存 · 離線可用';
          subtitle.className = 'text-[12px] text-slate-500 dark:text-slate-400 truncate';
        }

        if (state.categories.length === 0) {
          container.innerHTML = '';
          emptyState.classList.remove('hidden');
          document.getElementById('empty-state-title').textContent = '目前沒有任何行李分類';
          document.getElementById('empty-state-desc').textContent = '在上方輸入大組名稱開始建立，或直接載入預設旅行範本。';
          document.getElementById('empty-load-template-btn').classList.remove('hidden');
          if (window.lucide) lucide.createIcons();
          return;
        }

        emptyState.classList.add('hidden');

        let renderedCategoriesCount = 0;
        const html = state.categories.map((cat, catIndex) => {
          const subTotal = cat.subgroups.reduce((acc, s) => acc + s.items.length, 0);
          const subChecked = cat.subgroups.reduce((acc, s) => acc + s.items.filter(i => i.checked).length, 0);
          const catTotal = cat.items.length + subTotal;
          const catChecked = cat.items.filter(i => i.checked).length + subChecked;
          const isCatComplete = catTotal > 0 && catChecked === catTotal;

          if (state.filter === 'unchecked' && !state.editMode && catTotal > 0 && isCatComplete) {
            return '';
          }

          renderedCategoriesCount++;

          const visibleDirectItems = state.filter === 'unchecked'
            ? cat.items.filter(i => !i.checked)
            : cat.items;

          const hasSubgroups = cat.subgroups.length > 0;

          const directItemsHtml = visibleDirectItems.length > 0
            ? `<ul class="sortable-items space-y-0.5" data-cat-id="${cat.id}" data-sub-id="">${visibleDirectItems.map(item => renderItemRow(cat.id, null, item)).join('')}</ul>`
            : `<ul class="sortable-items min-h-[4px]" data-cat-id="${cat.id}" data-sub-id=""></ul>`;

          // 無論大組底下是否已有小組或直屬細項，大組底部永遠常駐顯示「直屬細項區與新增輸入列」
          const directSectionHtml = `
            <div class="${hasSubgroups ? 'pt-3.5 mt-3.5 border-t border-dashed border-slate-200 dark:border-slate-800' : ''}">
              ${hasSubgroups
                ? `<div class="flex items-center justify-between px-1 mb-1.5">
                     <span class="scale-badge-text font-semibold tracking-wide text-slate-500 dark:text-slate-400 flex items-center gap-1.5">
                       <i data-lucide="list" class="w-3.5 h-3.5 text-slate-400"></i>
                       <span>未分小組（直屬細項）</span>
                     </span>
                     <span class="scale-badge-text text-slate-400 dark:text-slate-500">${cat.items.length} 項</span>
                   </div>`
                : (cat.items.length === 0
                    ? `<p class="scale-badge-text text-slate-400 dark:text-slate-500 text-center py-2">尚無細項，可直接在下方新增，或點右上「+ 小組」建立分層</p>`
                    : '')
              }
              ${directItemsHtml}
              ${renderQuickAddForm(cat.id, null, hasSubgroups ? '＋ 新增未分小組直屬細項...' : '＋ 新增細項...')}
            </div>
          `;

          const subgroupsHtml = cat.subgroups.map((sub, subIndex) => {
            const sTotal = sub.items.length;
            const sChecked = sub.items.filter(i => i.checked).length;
            const isSubComplete = sTotal > 0 && sChecked === sTotal;

            if (state.filter === 'unchecked' && !state.editMode && sTotal > 0 && isSubComplete) {
              return '';
            }

            const visibleSubItems = state.filter === 'unchecked'
              ? sub.items.filter(i => !i.checked)
              : sub.items;

            return `
              <div data-sub-id="${sub.id}" class="rounded-xl bg-slate-50/95 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-700/70 border-l-4 ${isSubComplete ? 'border-l-emerald-500' : 'border-l-amber-500'} p-3 transition-all">
                <!-- 小組標題列（含小組拖曳手把） -->
                <div class="flex items-center justify-between gap-1.5 mb-2">
                  <div class="flex items-center gap-1 min-w-0">
                    <span
                      class="drag-handle p-1 rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 cursor-grab active:cursor-grabbing shrink-0"
                      title="按住上下拖曳調整小組順序"
                      aria-label="拖曳調整小組順序"
                    >
                      <i data-lucide="grip-vertical" class="w-4 h-4"></i>
                    </span>
                    <button
                      type="button"
                      data-action="toggle-sub-collapse"
                      data-cat-id="${cat.id}"
                      data-sub-id="${sub.id}"
                      title="${sub.collapsed ? '展開小組' : '收合小組'}"
                      class="p-1 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-transform cursor-pointer ${sub.collapsed ? '-rotate-90' : ''}"
                    >
                      <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                    <i data-lucide="folder-open" class="w-4 h-4 text-amber-600 dark:text-amber-400 shrink-0"></i>
                    <h3
                      data-action="edit-subgroup"
                      data-cat-id="${cat.id}"
                      data-sub-id="${sub.id}"
                      title="點擊修改小組名稱"
                      class="scale-subgroup-title font-bold text-slate-800 dark:text-slate-100 truncate cursor-pointer hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors"
                    >
                      ${escapeHtml(sub.name)}
                    </h3>
                    <span class="scale-badge-text font-semibold px-2 py-0.5 rounded-full shrink-0 ${isSubComplete ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-slate-200/80 text-slate-600 dark:bg-slate-700 dark:text-slate-300'}">
                      ${sChecked}/${sTotal}
                    </span>
                  </div>

                  <!-- 小組管理操作 -->
                  <div class="flex items-center gap-1 shrink-0">
                    ${state.editMode ? `
                      <button
                        type="button"
                        data-action="move-sub-up"
                        data-cat-id="${cat.id}"
                        data-sub-id="${sub.id}"
                        ${subIndex === 0 ? 'disabled' : ''}
                        title="小組上移"
                        class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-30 cursor-pointer"
                      >
                        <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                      </button>
                      <button
                        type="button"
                        data-action="move-sub-down"
                        data-cat-id="${cat.id}"
                        data-sub-id="${sub.id}"
                        ${subIndex === cat.subgroups.length - 1 ? 'disabled' : ''}
                        title="小組下移"
                        class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-30 cursor-pointer"
                      >
                        <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
                      </button>
                    ` : ''}
                    <button
                      type="button"
                      data-action="edit-subgroup"
                      data-cat-id="${cat.id}"
                      data-sub-id="${sub.id}"
                      title="重新命名小組"
                      class="p-1.5 rounded-lg text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 transition-colors cursor-pointer"
                    >
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                    </button>
                    <button
                      type="button"
                      data-action="delete-subgroup"
                      data-cat-id="${cat.id}"
                      data-sub-id="${sub.id}"
                      title="刪除小組"
                      class="p-1.5 rounded-lg text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 transition-colors cursor-pointer"
                    >
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>

                <!-- 小組內的細項列表 -->
                <div class="${sub.collapsed ? 'hidden' : 'block'}">
                  <ul class="sortable-items space-y-0.5 mb-1 ${visibleSubItems.length === 0 ? 'min-h-[4px]' : ''}" data-cat-id="${cat.id}" data-sub-id="${sub.id}">
                    ${visibleSubItems.map(item => renderItemRow(cat.id, sub.id, item)).join('')}
                  </ul>
                  ${visibleSubItems.length === 0
                    ? `<p class="scale-badge-text text-slate-400 dark:text-slate-500 text-center py-1.5">${sTotal === 0 ? '此小組尚無細項' : '此小組項目已全數完成！'}</p>`
                    : ''
                  }
                  ${renderQuickAddForm(cat.id, sub.id, `＋ 新增「${sub.name}」細項...`)}
                </div>
              </div>
            `;
          }).join('');

          return `
            <section data-cat-id="${cat.id}" class="bg-white dark:bg-slate-900 border ${isCatComplete ? 'border-emerald-300 dark:border-emerald-900/70' : 'border-slate-200/90 dark:border-slate-800'} rounded-2xl shadow-2xs overflow-hidden transition-all">
              <!-- 大組標題列（含大組拖曳手把） -->
              <div class="px-3 py-3 bg-slate-50/95 dark:bg-slate-800/70 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between gap-1.5">
                <div class="flex items-center gap-1 min-w-0">
                  <span
                    class="drag-handle p-1.5 rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 cursor-grab active:cursor-grabbing shrink-0"
                    title="按住拖曳調整大組順序"
                    aria-label="拖曳調整大組順序"
                  >
                    <i data-lucide="grip-vertical" class="w-4 h-4"></i>
                  </span>
                  <button
                    type="button"
                    data-action="toggle-collapse"
                    data-cat-id="${cat.id}"
                    title="${cat.collapsed ? '展開大組' : '收合大組'}"
                    class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-transform cursor-pointer ${cat.collapsed ? '-rotate-90' : ''}"
                  >
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                  </button>

                  <h2
                    data-action="edit-category"
                    data-cat-id="${cat.id}"
                    title="點擊重新命名大組"
                    class="scale-group-title font-bold text-slate-900 dark:text-slate-100 truncate cursor-pointer hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors"
                  >
                    ${escapeHtml(cat.name)}
                  </h2>

                  <span class="scale-badge-text font-semibold px-2 py-0.5 rounded-full shrink-0 ${isCatComplete ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-slate-200/80 text-slate-600 dark:bg-slate-800 dark:text-slate-400'}">
                    ${catChecked}/${catTotal}
                  </span>
                </div>

                <!-- 大組操作工具列 -->
                <div class="flex items-center gap-1 shrink-0">
                  <button
                    type="button"
                    data-action="add-subgroup"
                    data-cat-id="${cat.id}"
                    title="在此大組內建立小組"
                    class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-[12px] font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200/80 dark:border-amber-800/60 hover:bg-amber-100 dark:hover:bg-amber-900/60 transition-colors cursor-pointer"
                  >
                    <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
                    <span>+ 小組</span>
                  </button>

                  ${state.editMode ? `
                    <button
                      type="button"
                      data-action="move-cat-up"
                      data-cat-id="${cat.id}"
                      ${catIndex === 0 ? 'disabled' : ''}
                      title="大組上移"
                      class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-30 cursor-pointer"
                    >
                      <i data-lucide="arrow-up" class="w-4 h-4"></i>
                    </button>
                    <button
                      type="button"
                      data-action="move-cat-down"
                      data-cat-id="${cat.id}"
                      ${catIndex === state.categories.length - 1 ? 'disabled' : ''}
                      title="大組下移"
                      class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-30 cursor-pointer"
                    >
                      <i data-lucide="arrow-down" class="w-4 h-4"></i>
                    </button>
                  ` : ''}

                  <button
                    type="button"
                    data-action="edit-category"
                    data-cat-id="${cat.id}"
                    title="編輯大組名稱"
                    class="p-1.5 rounded-lg text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 transition-colors cursor-pointer"
                  >
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>

                  <button
                    type="button"
                    data-action="delete-category"
                    data-cat-id="${cat.id}"
                    title="刪除大組"
                    class="p-1.5 rounded-lg text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 transition-colors cursor-pointer"
                  >
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <!-- 大組內容區：先顯示各小組，底部永遠常駐直屬細項與新增輸入列 -->
              <div class="${cat.collapsed ? 'hidden' : 'block'} p-3.5">
                ${hasSubgroups ? `<div class="sortable-subgroups space-y-3" data-cat-id="${cat.id}">${subgroupsHtml}</div>` : ''}
                ${directSectionHtml}
              </div>
            </section>
          `;
        }).join('');

        container.innerHTML = html;

        if (state.filter === 'unchecked' && renderedCategoriesCount === 0 && stats.total > 0) {
          emptyState.classList.remove('hidden');
          document.getElementById('empty-state-title').textContent = '太棒了！所有項目都已打勾完成';
          document.getElementById('empty-state-desc').textContent = '切換回「全部」檢視完整清單，或點擊「清空打勾」準備下一趟旅程。';
          document.getElementById('empty-load-template-btn').classList.add('hidden');
        }

        if (window.lucide) {
          lucide.createIcons();
        }

        // 初始化三層級觸控拖曳排序
        initSortableInstances();
      }

      // 儲存目前的 Sortable 實例並在每次重新渲染前銷毀重建
      let sortableInstances = [];
      function destroySortableInstances() {
        sortableInstances.forEach(inst => {
          try { inst.destroy(); } catch (e) {}
        });
        sortableInstances = [];
      }

      function initSortableInstances() {
        destroySortableInstances();
        if (typeof Sortable === 'undefined') return;

        // 1. 大組層級拖曳排序
        const catContainer = document.getElementById('categories-container');
        if (catContainer) {
          sortableInstances.push(new Sortable(catContainer, {
            animation: 150,
            handle: '> div > .flex > .drag-handle',
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            onEnd: () => {
              const orderedIds = Array.from(catContainer.children)
                .map(el => el.dataset.catId)
                .filter(Boolean);
              if (orderedIds.length === 0) return;
              const map = new Map(state.categories.map(c => [c.id, c]));
              const reordered = orderedIds.map(id => map.get(id)).filter(Boolean);
              state.categories.forEach(c => {
                if (!orderedIds.includes(c.id)) reordered.push(c);
              });
              state.categories = reordered;
              saveState(true, '已更新大組順序');
              render();
            }
          }));
        }

        // 2. 小組層級拖曳排序（各自大組內）
        document.querySelectorAll('.sortable-subgroups').forEach(subListEl => {
          const catId = subListEl.dataset.catId;
          sortableInstances.push(new Sortable(subListEl, {
            animation: 150,
            handle: '> div > .flex > .drag-handle',
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            onEnd: () => {
              const cat = state.categories.find(c => c.id === catId);
              if (!cat) return;
              const orderedSubIds = Array.from(subListEl.children)
                .map(el => el.dataset.subId)
                .filter(Boolean);
              const map = new Map(cat.subgroups.map(s => [s.id, s]));
              const reordered = orderedSubIds.map(id => map.get(id)).filter(Boolean);
              cat.subgroups.forEach(s => {
                if (!orderedSubIds.includes(s.id)) reordered.push(s);
              });
              cat.subgroups = reordered;
              saveState(true, '已更新小組順序');
              render();
            }
          }));
        });

        // 3. 細項層級拖曳排序（支援同容器排序，以及同一大組內跨小組/直屬區拖曳移動）
        document.querySelectorAll('.sortable-items').forEach(itemListEl => {
          const catId = itemListEl.dataset.catId;
          sortableInstances.push(new Sortable(itemListEl, {
            group: `items-group-${catId}`,
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            onEnd: (evt) => {
              const cat = state.categories.find(c => c.id === catId);
              if (!cat) return;

              const fromSubId = evt.from.dataset.subId || null;
              const toSubId = evt.to.dataset.subId || null;
              const movedItemId = evt.item.dataset.itemId;
              if (!movedItemId) return;

              const sourceList = fromSubId
                ? cat.subgroups.find(s => s.id === fromSubId)?.items
                : cat.items;
              const targetList = toSubId
                ? cat.subgroups.find(s => s.id === toSubId)?.items
                : cat.items;
              if (!sourceList || !targetList) return;

              // 從來源陣列取出該細項
              const srcIndex = sourceList.findIndex(i => i.id === movedItemId);
              if (srcIndex === -1) return;
              const [movedItem] = sourceList.splice(srcIndex, 1);

              // 依據目標 DOM 列表的最新順序重建目標陣列（相容「只看未完成」篩選模式）
              const domOrderedIds = Array.from(evt.to.children)
                .map(el => el.dataset.itemId)
                .filter(Boolean);

              const pool = new Map(targetList.map(i => [i.id, i]));
              pool.set(movedItem.id, movedItem);

              const newTargetList = [];
              domOrderedIds.forEach(id => {
                if (pool.has(id)) {
                  newTargetList.push(pool.get(id));
                  pool.delete(id);
                }
              });
              // 將篩選模式下隱藏的已打勾項目接回尾端
              pool.forEach(remainingItem => newTargetList.push(remainingItem));

              if (toSubId) {
                const targetSub = cat.subgroups.find(s => s.id === toSubId);
                if (targetSub) targetSub.items = newTargetList;
              } else {
                cat.items = newTargetList;
              }

              saveState(true, fromSubId !== toSubId ? '已移動細項位置' : '已更新細項順序');
              render();
            }
          }));
        });
      }

      // 綁定所有使用者互動事件（委派點擊、勾選、表單送出與快捷功能）
      function bindEvents() {
        // 1. 三級字體大小切換
        document.querySelectorAll('.font-size-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            applyFontSize(btn.dataset.fontSize, true);
          });
        });

        // 2. 點擊標題修改清單名稱
        const titleEl = document.getElementById('list-title');
        titleEl.addEventListener('click', async () => {
          const res = await openModal({
            title: '修改檢查表標題',
            mode: 'input-simple',
            defaultName: state.title,
            confirmText: '儲存'
          });
          if (res && res.name) {
            state.title = res.name;
            saveState(true, '已更新標題');
            render();
          }
        });

        // 3. 篩選切換（全部 / 只看未完成）
        document.getElementById('filter-all-btn').addEventListener('click', () => {
          state.filter = 'all';
          render();
        });
        document.getElementById('filter-unchecked-btn').addEventListener('click', () => {
          state.filter = 'unchecked';
          render();
        });

        // 4. 管理架構模式切換
        document.getElementById('toggle-edit-mode-btn').addEventListener('click', () => {
          state.editMode = !state.editMode;
          render();
        });

        // 5. 清空所有打勾（保留大組、小組與細項架構）
        document.getElementById('reset-checks-btn').addEventListener('click', async () => {
          const stats = calculateStats();
          if (stats.checked === 0) {
            showToast('目前沒有已打勾的項目');
            return;
          }
          const ok = await openModal({
            title: '清空所有打勾？',
            message: `確定要取消全部 ${stats.checked} 個已勾選項目嗎？所有大組、小組與細項清單都會完整保留供下次使用。`,
            confirmText: '清空打勾',
            confirmClass: 'bg-amber-600 hover:bg-amber-500 text-white'
          });
          if (ok) {
            state.categories.forEach(cat => {
              cat.items.forEach(i => { i.checked = false; });
              cat.subgroups.forEach(sub => {
                sub.items.forEach(i => { i.checked = false; });
              });
            });
            saveState(true, '已清空所有打勾，架構完整保留');
            render();
          }
        });

        // 6. 更多選項下拉選單（匯出 / 匯入 / 載入範本）
        const moreBtn = document.getElementById('more-menu-btn');
        const moreDropdown = document.getElementById('more-menu-dropdown');
        moreBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          moreDropdown.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
          if (!document.getElementById('more-menu-container').contains(e.target)) {
            moreDropdown.classList.add('hidden');
          }
        });

        // 匯出 JSON 備份
        document.getElementById('export-json-btn').addEventListener('click', () => {
          moreDropdown.classList.add('hidden');
          const payload = {
            version: 2,
            title: state.title,
            categories: state.categories,
            exportedAt: new Date().toISOString()
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const dateStr = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `packing-checklist-${dateStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('已匯出 JSON 備份檔');
        });

        // 匯入 JSON 備份
        const importInput = document.getElementById('import-file-input');
        document.getElementById('import-json-btn').addEventListener('click', () => {
          moreDropdown.classList.add('hidden');
          importInput.value = '';
          importInput.click();
        });
        importInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async (evt) => {
            try {
              const parsed = JSON.parse(evt.target.result);
              if (!parsed || !Array.isArray(parsed.categories)) {
                throw new Error('格式不符');
              }
              const ok = await openModal({
                title: '確認匯入備份？',
                message: `即將匯入「${parsed.title || '行李檢查表'}」（共 ${parsed.categories.length} 個大組），這將會覆蓋目前的清單內容。`,
                confirmText: '確認匯入',
                confirmClass: 'bg-emerald-600 hover:bg-emerald-500 text-white'
              });
              if (ok) {
                state.title = parsed.title || '行李檢查表';
                state.categories = normalizeCategories(parsed.categories);
                saveState(true, '已成功匯入清單備份');
                render();
              }
            } catch (err) {
              showToast('匯入失敗：JSON 檔案格式錯誤');
            }
          };
          reader.readAsText(file);
        });

        // 載入預設旅行範本
        const handleLoadTemplate = async () => {
          moreDropdown.classList.add('hidden');
          const ok = await openModal({
            title: '載入預設旅行範本？',
            message: '這會將清單重設為預設的旅行範本（包含證件、衣物穿搭小組、電子設備），確定要執行嗎？',
            confirmText: '載入範本',
            confirmClass: 'bg-emerald-600 hover:bg-emerald-500 text-white'
          });
          if (ok) {
            state.title = DEFAULT_TEMPLATE.title;
            state.categories = normalizeCategories(JSON.parse(JSON.stringify(DEFAULT_TEMPLATE.categories)));
            saveState(true, '已載入預設旅行範本');
            render();
          }
        };
        document.getElementById('load-template-btn').addEventListener('click', handleLoadTemplate);
        document.getElementById('empty-load-template-btn').addEventListener('click', handleLoadTemplate);

        // 7. 新增大組表單
        document.getElementById('add-category-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const input = document.getElementById('new-category-input');
          const name = input.value.trim();
          if (!name) return;
          state.categories.push({
            id: uid('cat'),
            name,
            collapsed: false,
            items: [],
            subgroups: []
          });
          input.value = '';
          saveState(true, `已新增大組「${name}」`);
          render();
        });

        // 8. 清單區事件委派（勾選、新增細項、編輯與刪除大組/小組/細項）
        const catContainer = document.getElementById('categories-container');

        // 勾選狀態變更
        catContainer.addEventListener('change', (e) => {
          const target = e.target;
          if (target.dataset.action !== 'toggle-item') return;
          const { catId, subId, itemId } = target.dataset;
          const cat = state.categories.find(c => c.id === catId);
          if (!cat) return;
          const list = subId
            ? cat.subgroups.find(s => s.id === subId)?.items
            : cat.items;
          const item = list?.find(i => i.id === itemId);
          if (item) {
            item.checked = target.checked;
            saveState(false);
            render();
          }
        });

        // 快速新增細項表單送出
        catContainer.addEventListener('submit', (e) => {
          const form = e.target;
          if (form.dataset.action !== 'add-item-form') return;
          e.preventDefault();
          const { catId, subId } = form.dataset;
          const cat = state.categories.find(c => c.id === catId);
          if (!cat) return;

          const nameInput = form.querySelector('input[name="itemName"]');
          const qtyInput = form.querySelector('input[name="itemQty"]');
          const weightInput = form.querySelector('input[name="itemWeight"]');

          const name = nameInput.value.trim();
          if (!name) return;

          const newItem = normalizeItem({
            id: uid('item'),
            name,
            checked: false,
            qty: parseInt(qtyInput.value, 10) || 1,
            weight: parseInt(weightInput.value, 10) || 0,
            note: ''
          });

          if (subId) {
